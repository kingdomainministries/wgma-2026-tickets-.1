<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#150720">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>Page not found · WGMA 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:wght@400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--ink:#150720;--gold:#d4a534;--gold-lift:#f0d67f;--gold-pale:#f6e9c4;--paper:#f7f3ea;--line:rgba(212,165,52,.38)}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:grid;place-items:center;padding:24px;
  font-family:'Jost',sans-serif;font-weight:300;color:var(--paper);
  background:radial-gradient(60% 45% at 50% 15%,rgba(122,58,168,.5),transparent 70%),linear-gradient(180deg,#200c31,#150720);
}
.card{max-width:480px;width:100%;text-align:center;border:1px solid var(--gold);background:rgba(61,26,86,.5);padding:44px 30px}
img{width:130px;margin:0 auto 24px;display:block}
.kicker{font-family:'Cormorant Garamond',serif;letter-spacing:.3em;font-size:.82rem;color:var(--gold-pale);margin-bottom:12px}
h1{font-family:'Cinzel',serif;font-weight:500;font-size:1.4rem;color:var(--gold-lift);letter-spacing:.05em;line-height:1.35}
.rule{display:flex;align-items:center;gap:12px;margin:24px auto;max-width:200px}
.rule::before,.rule::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold))}
.rule::after{background:linear-gradient(90deg,var(--gold),transparent)}
.rule i{width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
p{font-family:'Cormorant Garamond',serif;font-size:1.12rem;line-height:1.7;color:#e7dcf0}
a{display:inline-block;margin-top:26px;padding:13px 30px;border:1px solid var(--gold);color:var(--gold-lift);text-decoration:none;font-size:.88rem;letter-spacing:.16em}
a:hover{background:var(--gold);color:var(--ink)}
.foot{margin-top:22px;font-family:'Jost',sans-serif;font-size:.88rem;color:#c9b6d8}
</style>
</head>
<body>
<div class="card">
  <img src="/img/wga-logo.png" alt="Western Gospel Music Awards">
  <p class="kicker">404</p>
  <h1>That page is not here</h1>
  <div class="rule"><i></i></div>
  <p>The link may be old, or a letter may have gone astray. Everything about the awards lives on the main page.</p>
  <a href="/">Go to the event</a>
  <p class="foot">Looking for a ticket you already bought? WhatsApp 876 816 2565.</p>
</div>
</body>
</html>
