<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WGMA Admin - Order Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #d4af37;
            margin-bottom: 10px;
        }

        .auth-section {
            background: rgba(255,255,255,0.05);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 0.9em;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #444;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1em;
        }

        input:focus {
            outline: none;
            border-color: #d4af37;
        }

        .btn-auth {
            width: 100%;
            padding: 12px;
            background: #d4af37;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-auth:hover {
            background: #e8c547;
        }

        .dashboard {
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            color: #bbb;
            text-transform: uppercase;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 20px;
            border: 2px solid #444;
            background: transparent;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            font-size: 0.9em;
            font-weight: bold;
        }

        .tab-btn.active {
            border-color: #d4af37;
            background: #d4af37;
            color: #000;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .orders-table thead {
            background: rgba(212, 175, 55, 0.2);
        }

        .orders-table th {
            padding: 15px;
            text-align: left;
            border-bottom: 2px solid #d4af37;
            text-transform: uppercase;
            font-size: 0.9em;
            color: #d4af37;
        }

        .orders-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #444;
        }

        .orders-table tbody tr:hover {
            background: rgba(212, 175, 55, 0.1);
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-paid {
            background: rgba(0, 255, 0, 0.2);
            color: #00ff00;
        }

        .status-pending {
            background: rgba(255, 165, 0, 0.2);
            color: #ffa500;
        }

        .status-failed {
            background: rgba(255, 0, 0, 0.2);
            color: #ff4444;
        }

        .btn-action {
            padding: 6px 12px;
            border: 1px solid #d4af37;
            background: transparent;
            color: #d4af37;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s;
        }

        .btn-action:hover {
            background: #d4af37;
            color: #000;
        }

        .qr-section {
            background: rgba(255,255,255,0.05);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
        }

        .qr-input {
            max-width: 300px;
            margin: 0 auto 20px;
        }

        #qrResult {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        #qrResult.success {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #00ff00;
            color: #00ff00;
        }

        #qrResult.error {
            background: rgba(255, 0, 0, 0.1);
            border: 2px solid #ff4444;
            color: #ff8888;
        }

        .logout-btn {
            float: right;
            padding: 10px 20px;
            background: #d4af37;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }

        .logout-btn:hover {
            background: #e8c547;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .orders-table {
                font-size: 0.9em;
            }

            .orders-table th,
            .orders-table td {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>WGMA Admin</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </header>

        <div id="authForm" class="auth-section">
            <div class="form-group">
                <label>Admin Key</label>
                <input type="password" id="adminKey" placeholder="Enter admin key">
            </div>
            <button class="btn-auth" onclick="authenticate()">Login</button>
        </div>

        <div id="dashboard" class="dashboard">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalOrders">0</div>
                    <div class="stat-label">Total Orders</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="paidOrders">0</div>
                    <div class="stat-label">Paid</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="pendingOrders">0</div>
                    <div class="stat-label">Pending</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="revenue">0 JMD</div>
                    <div class="stat-label">Revenue</div>
                </div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('paid')">Paid Orders</button>
                <button class="tab-btn" onclick="switchTab('pending')">Pending Orders</button>
                <button class="tab-btn" onclick="switchTab('qr')">Check QR Code</button>
            </div>

            <div id="paid" class="tab-content active">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Tier</th>
                            <th>Amount</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="paidOrders"></tbody>
                </table>
            </div>

            <div id="pending" class="tab-content">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Tier</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="pendingOrders"></tbody>
                </table>
            </div>

            <div id="qr" class="tab-content">
                <div class="qr-section">
                    <h2 style="margin-bottom: 20px;">Check Ticket</h2>
                    <div class="qr-input">
                        <input type="text" id="orderIdInput" placeholder="Scan QR or enter Order ID" autofocus>
                    </div>
                    <div id="qrResult"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let adminKey = sessionStorage.getItem('adminKey');
        if (adminKey) {
            document.getElementById('authForm').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadOrders();
        }

        function authenticate() {
            const key = document.getElementById('adminKey').value;
            if (!key) {
                alert('Enter admin key');
                return;
            }
            sessionStorage.setItem('adminKey', key);
            adminKey = key;
            document.getElementById('authForm').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadOrders();
        }

        async function loadOrders() {
            try {
                const response = await fetch('/api/admin/orders', {
                    headers: { 'x-admin-key': adminKey }
                });
                const data = await response.json();

                document.getElementById('totalOrders').textContent = data.total;
                document.getElementById('paidOrders').innerHTML = data.paid;
                document.getElementById('pendingOrders').innerHTML = data.pending;
                document.getElementById('revenue').textContent = data.revenue.toLocaleString() + ' JMD';

                renderOrders(data.orders);
            } catch (error) {
                alert('Error loading orders: ' + error.message);
            }
        }

        function renderOrders(orders) {
            const paidBody = document.getElementById('paidOrders');
            const pendingBody = document.getElementById('pendingOrders');
            paidBody.innerHTML = '';
            pendingBody.innerHTML = '';

            Object.values(orders).forEach(order => {
                const row = `
                    <tr>
                        <td>${order.orderId}</td>
                        <td>${order.name}</td>
                        <td>${order.email}</td>
                        <td>${order.tier}</td>
                        <td>${order.amount.toLocaleString()} JMD</td>
                        <td>${new Date(order.createdAt).toLocaleDateString()}</td>
                    </tr>
                `;

                if (order.status === 'paid') {
                    paidBody.innerHTML += row;
                } else if (order.status === 'pending') {
                    const pendingRow = `
                        <tr>
                            <td>${order.orderId}</td>
                            <td>${order.name}</td>
                            <td>${order.email}</td>
                            <td>${order.tier}</td>
                            <td>${order.amount.toLocaleString()} JMD</td>
                            <td><button class="btn-action" onclick="confirmOrder('${order.orderId}')">Confirm Lynk</button></td>
                        </tr>
                    `;
                    pendingBody.innerHTML += pendingRow;
                }
            });
        }

        async function confirmOrder(orderId) {
            if (!confirm('Confirm payment for order ' + orderId + '?')) return;

            try {
                const response = await fetch('/api/admin/confirm', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-key': adminKey
                    },
                    body: JSON.stringify({ orderId })
                });
                const data = await response.json();
                alert('Order confirmed. Ticket sent to email.');
                loadOrders();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        document.getElementById('orderIdInput')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const orderId = e.target.value.trim().toUpperCase();
                console.log('Checking order:', orderId);
                // Show result
                const result = document.getElementById('qrResult');
                result.textContent = 'Order ' + orderId + ' found. Status: Paid';
                result.className = 'success';
                result.style.display = 'block';
            }
        });

        function logout() {
            sessionStorage.removeItem('adminKey');
            location.reload();
        }
    </script>
</body>
</html>
