# Render blueprint. Optional — you can also click through the dashboard.
# The disk keeps orders.json across restarts, which the free tier will not.
services:
  - type: web
    name: wgma-2026-tickets
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: orders
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_FILE
        value: /var/data/orders.json
      - key: DOMAIN
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: ORGANISER_EMAIL
        sync: false
      - key: HANDYPAY_API_KEY
        sync: false
      - key: HANDYPAY_WEBHOOK_SECRET
        sync: false
      - key: LYNK_HANDLE
        sync: false
      - key: ADMIN_KEY
        sync: false
